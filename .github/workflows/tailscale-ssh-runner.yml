name: Ubuntu Tailscale SSH Runner

on:
  workflow_dispatch:
    inputs:
      launch:
        description: 'Start the runner'
        required: false
        default: 'yes'

permissions:
  contents: write

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install OpenSSH server and tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server curl git zstd openssl
      - name: Checkout selected repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install OpenCode
        id: install_opencode
        env:
          OPENCODE_CONSOLE_API_KEY: ${{ secrets.OPENCODE_CONSOLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm"
          chmod 700 "$HOME/.npm"
          npm install -g @opencode/cli
          NPM_GLOBAL_BIN="$(npm prefix --global)/bin"
          export PATH="$NPM_GLOBAL_BIN:$PATH"
          [[ -x "$NPM_GLOBAL_BIN/opencode" ]] || { echo 'OpenCode CLI binary was not installed.' >&2; exit 1; }
          sudo ln -sf "$NPM_GLOBAL_BIN/opencode" /usr/local/bin/opencode
          grep -Fqx "export PATH=\"$NPM_GLOBAL_BIN:\$PATH\"" "$HOME/.bashrc" 2>/dev/null || printf 'export PATH="%s:$PATH"\n' "$NPM_GLOBAL_BIN" >> "$HOME/.bashrc"
          grep -Fqx "export PATH=\"$NPM_GLOBAL_BIN:\$PATH\"" "$HOME/.profile" 2>/dev/null || printf 'export PATH="%s:$PATH"\n' "$NPM_GLOBAL_BIN" >> "$HOME/.profile"
          command -v opencode
          opencode --version
          if [[ -n "$OPENCODE_CONSOLE_API_KEY" ]]; then
            opencode auth login opencode --method key --answer "key=$OPENCODE_CONSOLE_API_KEY"
            echo 'OpenCode Console API authenticated.'
          fi
          if [[ -n "$TELEGRAM_BOT_TOKEN" ]]; then
            export OPENCODE_SERVER_PASSWORD="$(openssl rand -hex 32)"
            echo "OPENCODE_SERVER_PASSWORD=$OPENCODE_SERVER_PASSWORD" >> "$GITHUB_ENV"
            nohup env OPENCODE_SERVER_PASSWORD="$OPENCODE_SERVER_PASSWORD" opencode serve --hostname 127.0.0.1 --port 4096 >/tmp/revps-opencode-server.log 2>&1 </dev/null &
            SERVER_PID=$!
            for _ in {1..20}; do
              if opencode api --server http://127.0.0.1:4096 get /global/health >/dev/null 2>&1; then break; fi
              sleep 1
            done
            kill -0 "$SERVER_PID" || { echo 'OpenCode server failed to start; logs are kept private.' >&2; exit 1; }
          fi

      - name: Start OpenCode Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_ALLOWED_USER_ID" ]]; then
            echo 'Telegram integration is not configured; skipping bot setup.'
            exit 0
          fi
          npm install -g @grinev/opencode-telegram-bot
          [[ "$TELEGRAM_ALLOWED_USER_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Telegram user ID secret is invalid.' >&2; exit 1; }
          nohup env \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_ALLOWED_USER_ID="$TELEGRAM_ALLOWED_USER_ID" \
            OPENCODE_SERVER_VERSION=v2 \
            OPENCODE_SERVER_MODE=standalone \
            OPENCODE_SERVER_USERNAME=opencode \
            OPENCODE_SERVER_PASSWORD="$OPENCODE_SERVER_PASSWORD" \
            OPENCODE_API_URL=http://127.0.0.1:4096 \
            OPENCODE_MODEL_PROVIDER=opencode \
            OPENCODE_MODEL_ID=big-pickle \
            OPENCODE_AUTO_RESTART_ENABLED=true \
            BOT_LOCALE=ar \
            opencode-telegram start >/tmp/revps-telegram-bot.log 2>&1 </dev/null &
          BOT_PID=$!
          sleep 5
          kill -0 "$BOT_PID" || { echo 'Telegram bot failed to start; logs are kept private.' >&2; exit 1; }
          echo 'OpenCode Telegram bot started for the configured Telegram user.'
      - name: Configure OpenSSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 -o runner -g runner /home/runner/.ssh
          printf '%s\n' "$SSH_PUBLIC_KEY" | sudo tee /home/runner/.ssh/authorized_keys >/dev/null
          sudo chown runner:runner /home/runner/.ssh/authorized_keys
          sudo chmod 600 /home/runner/.ssh/authorized_keys
          printf 'runner:%s\n' "$SSH_PASSWORD" | sudo chpasswd
          printf '%s\n' 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          printf '%s\n' 'PubkeyAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          sudo install -d -m 0755 /run/sshd
          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="gh-ubuntu-${GITHUB_RUN_ID}"
          IP="$(tailscale ip -4 | head -n1)"
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "SSH_COMMAND=ssh runner@$IP" >> "$GITHUB_ENV"
          echo "========================================"
          echo "TAILSCALE_IP=$IP"
          echo "SSH_COMMAND=ssh runner@$IP"
          echo "========================================"
      - name: Publish runner connection status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="RUN_ID=$GITHUB_RUN_ID\nTAILSCALE_IP=$TAILSCALE_IP\nSSH_COMMAND=ssh runner@$TAILSCALE_IP\nSTATUS=ready\n"
          CONTENT="$(printf '%b' "$STATUS" | base64 -w 0)"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/runner-status/$GITHUB_RUN_ID.txt" \
            -d "{\"message\":\"Publish runner connection status\",\"content\":\"$CONTENT\"}"
      - name: Show runner status
        run: |
          set -e
          echo "Runner: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "SSH service:"
          sudo systemctl --no-pager --full status ssh || true
          echo "Listening ports:"
          ss -lnt
      - name: Keep SSH runner alive
        run: |
          set -euo pipefail
          trap 'exit 0' TERM INT
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] SSH runner alive at $TAILSCALE_IP"
            sleep 300
          done
