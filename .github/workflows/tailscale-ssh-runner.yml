name: Ubuntu Tailscale SSH Runner

on:
  workflow_dispatch:
    inputs:
      launch:
        description: 'Start the runner'
        required: false
        default: 'yes'

permissions:
  contents: write

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install OpenSSH server and tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server curl git zstd openssl
      - name: Checkout selected repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install OpenCode
        id: install_opencode
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm"
          chmod 700 "$HOME/.npm"
          npm install --global @opencode/cli@2.2.6
          NPM_GLOBAL_BIN="$(npm prefix --global)/bin"
          if ! command -v opencode >/dev/null 2>&1; then
            export PATH="$NPM_GLOBAL_BIN:$PATH"
          fi
          grep -Fqx "export PATH=\"$NPM_GLOBAL_BIN:\$PATH\"" "$HOME/.bashrc" 2>/dev/null || printf 'export PATH="%s:$PATH"\n' "$NPM_GLOBAL_BIN" >> "$HOME/.bashrc"
          grep -Fqx "export PATH=\"$NPM_GLOBAL_BIN:\$PATH\"" "$HOME/.profile" 2>/dev/null || printf 'export PATH="%s:$PATH"\n' "$NPM_GLOBAL_BIN" >> "$HOME/.profile"
          if [[ -n "$TELEGRAM_BOT_TOKEN" ]]; then
            npm i -g @grinev/opencode-telegram-bot@0.27.0
          fi
          command -v opencode
          opencode --version

      - name: Install ntfy notification skill
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode/skills/ntfy-notifications"
          cat > "$HOME/.config/opencode/skills/ntfy-notifications/SKILL.md" <<'SKILL'
          ---
          name: ntfy-notifications
          description: Send a completion notification through ntfy when the user explicitly asks to be notified after finishing work.
          ---

          # ntfy completion notifications

          Use this skill only when the user explicitly requests a completion notification, including wording such as "notify me when you finish", "notify me when you're done", "send me a notification when finished", or equivalent wording.

          The ntfy topic URL is provided in the `NTFY_URL` environment variable. Never reveal, print, commit, or include this URL in normal responses, logs, code, or status output.

          When the requested work is genuinely complete, send one concise notification with:

          ```bash
          curl --fail --silent --show-error --max-time 20 \\
            -H 'Title: OpenCode task finished' \\
            -H 'Tags: white_check_mark' \\
            --data-raw 'OpenCode finished the requested task.' \\
            "$NTFY_URL"
          ```

          If `NTFY_URL` is empty, do not attempt a request and tell the user that ntfy is not configured. Do not send notifications for ordinary tasks unless the user asked for one. Do not claim that a notification was sent unless the curl command succeeds.
          SKILL
          chmod 600 "$HOME/.config/opencode/skills/ntfy-notifications/SKILL.md"
      - name: Configure OpenCode and Zen key routing
        env:
          OPENCODE_ZEN_API_KEYS_JSON: ${{ secrets.OPENCODE_ZEN_API_KEYS }}
          REVPS_OPENCODE_MODEL: ${{ vars.REVPS_OPENCODE_MODEL }}
        run: |
          set -euo pipefail
          if [[ -n "$OPENCODE_ZEN_API_KEYS_JSON" ]]; then
            curl -fsSL "https://gist.githubusercontent.com/cacobooer-ux/775b99e237acfbc2c35145b978473ef7/raw/zen-key-proxy.mjs?cb=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$RUNNER_TEMP/zen-key-proxy.mjs"
            node --check "$RUNNER_TEMP/zen-key-proxy.mjs"
            nohup env ZEN_API_KEYS_JSON="$OPENCODE_ZEN_API_KEYS_JSON" PORT=4097 node "$RUNNER_TEMP/zen-key-proxy.mjs" >/tmp/revps-zen-proxy.log 2>&1 </dev/null &
            PROXY_PID=$!
            for _ in {1..20}; do
              if curl -fsS http://127.0.0.1:4097/health -o "$RUNNER_TEMP/zen-health.json"; then break; fi
              sleep 1
            done
            kill -0 "$PROXY_PID"
            KEY_COUNT="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).keyCount)))' < "$RUNNER_TEMP/zen-health.json")"
            echo "OpenCode Zen key proxy ready ($KEY_COUNT key(s); values hidden)."
            printf '%s\n' 'export OPENCODE_API_KEY=revps-local-zen-proxy' >> "$HOME/.bashrc"
          else
            echo 'OpenCode Zen key proxy is not configured.'
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = {"$schema": "https://opencode.ai/config.json", "permission": "allow"}
          if os.environ.get("OPENCODE_ZEN_API_KEYS_JSON"):
              model = os.environ.get("REVPS_OPENCODE_MODEL") or "deepseek-v4.1-flash-free"
              config["model"] = f"opencode/{model}"
              config["provider"] = {"opencode": {"options": {"baseURL": "http://127.0.0.1:4097", "apiKey": "revps-local-zen-proxy"}}}
          payload = json.dumps(config, indent=2) + "\n"
          for target in (Path.home() / ".config/opencode/opencode.json", Path(os.environ["GITHUB_WORKSPACE"]) / "opencode.json"):
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(payload)
              target.chmod(0o600)
          PY
      - name: Configure OpenSSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 -o runner -g runner /home/runner/.ssh
          printf '%s\n' "$SSH_PUBLIC_KEY" | sudo tee /home/runner/.ssh/authorized_keys >/dev/null
          sudo chown runner:runner /home/runner/.ssh/authorized_keys
          sudo chmod 600 /home/runner/.ssh/authorized_keys
          printf 'runner:%s\n' "$SSH_PASSWORD" | sudo chpasswd
          printf '%s\n' 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          printf '%s\n' 'PubkeyAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          sudo install -d -m 0755 /run/sshd
          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="gh-ubuntu-${GITHUB_RUN_ID}"
          IP="$(tailscale ip -4 | head -n1)"
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "SSH_COMMAND=ssh runner@$IP" >> "$GITHUB_ENV"
          echo "========================================"
          echo "TAILSCALE_IP=$IP"
          echo "SSH_COMMAND=ssh runner@$IP"
          echo "========================================"
      - name: Start OpenCode Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          OPENCODE_ZEN_API_KEYS_JSON: ${{ secrets.OPENCODE_ZEN_API_KEYS }}
          REVPS_OPENCODE_MODEL: ${{ vars.REVPS_OPENCODE_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo 'Telegram integration is not configured; SSH access remains available.'
            exit 0
          fi
          [[ "$TELEGRAM_ALLOWED_USER_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Telegram user ID secret is invalid.' >&2; exit 1; }
          if [[ -n "$OPENCODE_ZEN_API_KEYS_JSON" ]]; then
            export OPENCODE_API_KEY=revps-local-zen-proxy
          fi
          OPENCODE_SERVER_PASSWORD="$(openssl rand -hex 32)"
          nohup env OPENCODE_SERVER_PASSWORD="$OPENCODE_SERVER_PASSWORD" opencode serve --hostname 127.0.0.1 --port 4096 >/tmp/revps-opencode-server.log 2>&1 </dev/null &
          SERVER_PID=$!
          sleep 5
          kill -0 "$SERVER_PID" || { echo 'OpenCode server failed to start; logs are kept private.' >&2; exit 1; }
          nohup env \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_ALLOWED_USER_ID="$TELEGRAM_ALLOWED_USER_ID" \
            OPENCODE_SERVER_VERSION=v2 \
            OPENCODE_SERVER_MODE=standalone \
            OPENCODE_SERVER_PASSWORD="$OPENCODE_SERVER_PASSWORD" \
            OPENCODE_API_URL=http://127.0.0.1:4096 \
            OPENCODE_MODEL_PROVIDER=opencode \
            OPENCODE_MODEL_ID="${REVPS_OPENCODE_MODEL:-deepseek-v4.1-flash-free}" \
            OPENCODE_AUTO_RESTART_ENABLED=true \
            BOT_LOCALE=ar \
            opencode-telegram start >/tmp/revps-telegram-bot.log 2>&1 </dev/null &
          BOT_PID=$!
          sleep 5
          kill -0 "$BOT_PID" || { echo 'Telegram bot failed to start; logs are kept private.' >&2; exit 1; }
          echo 'OpenCode Telegram bot started for the configured Telegram user.'
      - name: Publish runner connection status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="RUN_ID=$GITHUB_RUN_ID\nTAILSCALE_IP=$TAILSCALE_IP\nSSH_COMMAND=ssh runner@$TAILSCALE_IP\nSTATUS=ready\n"
          CONTENT="$(printf '%b' "$STATUS" | base64 -w 0)"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/runner-status/$GITHUB_RUN_ID.txt" \
            -d "{\"message\":\"Publish runner connection status\",\"content\":\"$CONTENT\"}"
      - name: Show runner status
        run: |
          set -e
          echo "Runner: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "SSH service:"
          sudo systemctl --no-pager --full status ssh || true
          echo "Listening ports:"
          ss -lnt
      - name: Keep SSH runner alive
        run: |
          set -euo pipefail
          trap 'exit 0' TERM INT
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] SSH runner alive at $TAILSCALE_IP"
            sleep 300
          done
